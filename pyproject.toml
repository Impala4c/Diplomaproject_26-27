[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-history"
version = "0.3.0"
description = "Local rule-based credential candidate scanner for Git history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
secret-history = "secret_history.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

